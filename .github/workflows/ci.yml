name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,remote,s3,docs]"
      - run: make test-cov
      - run: make django-test
      - run: make migrations-check
      - run: make check-deploy
      - run: make html
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate default Compose config
        run: docker compose -f compose.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-password
      - name: Validate host PostgreSQL Compose config
        run: docker compose -f compose.yaml -f compose.host-postgres.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-password
