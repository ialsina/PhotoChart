name: Provider acceptance

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider adapter to test
        required: true
        type: choice
        options:
          - local
          - pcloud_drive
          - pcloud_api
          - webdav
          - nextcloud
          - sftp
          - s3
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHOTOCHART_ACCEPTANCE_PROVIDER: ${{ inputs.provider || 'local' }}
      PHOTOCHART_ACCEPTANCE_CONFIG: /tmp/photochart-acceptance/config.yaml
      PHOTOCHART_ACCEPTANCE_SOURCE_OBJECT: ${{ secrets.ACCEPTANCE_SOURCE_OBJECT }}
      PHOTOCHART_ACCEPTANCE_PREFIX: ${{ secrets.ACCEPTANCE_PREFIX }}
      PCLOUD_ACCESS_TOKEN: ${{ secrets.PCLOUD_ACCESS_TOKEN }}
      WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
      WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,remote,s3]"
      - name: Prepare local fixture
        if: env.PHOTOCHART_ACCEPTANCE_PROVIDER == 'local'
        run: |
          mkdir -p /tmp/photochart-acceptance/source /tmp/photochart-acceptance/work
          printf 'photochart-acceptance\n' > /tmp/photochart-acceptance/source/fixture.jpg
          cat > /tmp/photochart-acceptance/config.yaml <<'YAML'
          adapter:
            type: local
          source:
            path: /tmp/photochart-acceptance/source
          destination:
            path: /tmp/photochart-acceptance/work
          YAML
          echo "PHOTOCHART_ACCEPTANCE_SOURCE_OBJECT=/tmp/photochart-acceptance/source/fixture.jpg" >> "$GITHUB_ENV"
          echo "PHOTOCHART_ACCEPTANCE_PREFIX=/tmp/photochart-acceptance/work" >> "$GITHUB_ENV"
      - name: Prepare credentialed provider configuration
        if: env.PHOTOCHART_ACCEPTANCE_PROVIDER != 'local'
        env:
          ACCEPTANCE_CONFIG_B64: ${{ secrets.ACCEPTANCE_CONFIG_B64 }}
        run: |
          mkdir -p /tmp/photochart-acceptance
          test -n "$ACCEPTANCE_CONFIG_B64"
          printf '%s' "$ACCEPTANCE_CONFIG_B64" | base64 --decode > "$PHOTOCHART_ACCEPTANCE_CONFIG"
          test -n "$PHOTOCHART_ACCEPTANCE_SOURCE_OBJECT"
          test -n "$PHOTOCHART_ACCEPTANCE_PREFIX"
      - run: python -m pytest tests/acceptance -m integration --no-cov
