# Opt-in topology for running the UI in Docker while PostgreSQL and pchart
# commands run on the host. Bind-mount the host MEDIA_ROOT from .env (same tree
# host pchart ingest writes); PHOTOCHART_MEDIA_PATH is a legacy fallback only.
# This file includes docker/compose.yaml and applies host-PostgreSQL overrides.
# From the repository root:
#   docker compose --project-directory . -f docker/compose.host-postgres.yaml up -d
# Equivalent:
#   docker compose --project-directory . -f docker/compose.yaml \
#     -f docker/compose.host-postgres.yaml up -d

include:
  - path: docker/compose.yaml
    project_directory: .
    env_file: .env

x-host-postgres-app: &host-postgres-app
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    COMPOSE_DATABASE_HOST: host.docker.internal
    DATABASE_URL: postgresql://${POSTGRES_USER:-photochart}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-photochart}
    MEDIA_ROOT: /app/backend/media
  volumes:
    - ${MEDIA_ROOT:-${PHOTOCHART_MEDIA_PATH:-./backend/media}}:/app/backend/media

services:
  # Disabled in this topology unless explicitly requested with
  # --profile container-postgres. App services use host PostgreSQL instead.
  db:
    profiles: ["container-postgres"]

  init-volumes:
    <<: *host-postgres-app

  ingest:
    <<: *host-postgres-app

  migrate:
    <<: *host-postgres-app

  web:
    <<: *host-postgres-app

  worker:
    <<: *host-postgres-app
    environment:
      COMPOSE_DATABASE_HOST: host.docker.internal
      DATABASE_URL: postgresql://${POSTGRES_USER:-photochart}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-photochart}
      MEDIA_ROOT: /app/backend/media
      COMPOSE_FILE: /app/docker/compose.yaml:/app/docker/compose.host-postgres.yaml

  beat:
    <<: *host-postgres-app

  gateway:
    volumes:
      - ${MEDIA_ROOT:-${PHOTOCHART_MEDIA_PATH:-./backend/media}}:/srv/media:ro
