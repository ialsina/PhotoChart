limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
map $http_x_forwarded_proto $photochart_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 10m;
    root /usr/share/nginx/html;
    # Re-resolve Docker service names when containers are recreated (avoids stale upstream IPs).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /_protected_media/ {
        internal;
        alias /srv/media/;
    }

    location ~ ^/(api|admin|livez|readyz|metrics|media|static)/? {
        set $backend web:8000;
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://$backend;
        # Preserve the port so Django build_absolute_uri() matches the gateway URL.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $photochart_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
